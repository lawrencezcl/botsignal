[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipscope-signal"
version = "0.1.0a1"
description = "Global market signal scanner — M-1a internal data accumulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
flipscope-signal = "flipscope_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
